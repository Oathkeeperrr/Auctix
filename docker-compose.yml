# AuctiX - full stack in one command.
#
#   cp .env.example .env
#   docker compose up --build
#
# Then open http://localhost

services:
  # ------------------------------------------------------------------ database
  postgres:
    image: postgres:16-alpine
    container_name: auctix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auctix}
      POSTGRES_USER: ${POSTGRES_USER:-auctix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auctix}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No host port by default: a local PostgreSQL install would collide with it.
    # Uncomment to attach pgAdmin or psql from the host, or use:
    #   docker compose exec postgres psql -U auctix -d auctix
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auctix} -d ${POSTGRES_DB:-auctix}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [auctix]

  # ------------------------------------------------------------------ cache & pub/sub
  redis:
    image: redis:7-alpine
    container_name: auctix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    # No host port by default: a local Redis install would collide with it. Use:
    #   docker compose exec redis redis-cli
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 4s
      retries: 10
    networks: [auctix]

  # ------------------------------------------------------------------ Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auctix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-auctix}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-auctix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-auctix}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:[*],http://127.0.0.1,http://127.0.0.1:[*]}"
      ANTI_SNIPE_ENABLED: ${ANTI_SNIPE_ENABLED:-true}
      ANTI_SNIPE_WINDOW_SECONDS: ${ANTI_SNIPE_WINDOW_SECONDS:-30}
      ANTI_SNIPE_EXTENSION_SECONDS: ${ANTI_SNIPE_EXTENSION_SECONDS:-30}
      BID_RATE_LIMIT_MAX: ${BID_RATE_LIMIT_MAX:-10}
      AUCTIX_UPLOAD_DIR: /app/uploads
      AUCTIX_SEED_ENABLED: ${AUCTIX_SEED_ENABLED:-true}
      AUCTIX_SEED_PASSWORD: ${AUCTIX_SEED_PASSWORD:-Password123!}
      LOG_LEVEL_AUCTIX: ${LOG_LEVEL_AUCTIX:-INFO}
    volumes:
      # Seller photographs live outside the image, so rebuilding the backend does not
      # discard them. Without this, every `docker compose up --build` loses the uploads.
      - uploads-data:/app/uploads

    # No host port by default: nginx already proxies /api, /ws, /swagger-ui and
    # /actuator/health, so nothing is lost. Uncomment only if you want to bypass nginx.
    # ports:
    #   - "${BACKEND_PORT:-8080}:8080"
    networks: [auctix]

  # ------------------------------------------------------------------ React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auctix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks: [auctix]

  # ------------------------------------------------------------------ edge proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: auctix-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [auctix]

volumes:
  postgres-data:
  redis-data:
  uploads-data:

networks:
  auctix:
    driver: bridge
