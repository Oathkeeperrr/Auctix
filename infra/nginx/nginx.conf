# AuctiX edge proxy.
#   /api  -> Spring Boot REST
#   /ws   -> Spring Boot STOMP over WebSocket (upgrade headers set below)
#   /images -> lot photographs from the backend's static resources
#   /uploads -> seller-uploaded photographs from the uploads-data volume
#   /     -> the React single-page app

upstream auctix_backend {
    server backend:8080;
    keepalive 32;
}

upstream auctix_frontend {
    server frontend:80;
    keepalive 16;
}

# Light protection against bid flooding at the edge; the backend enforces its own limit too.
limit_req_zone $binary_remote_addr zone=auctix_api:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------- REST API
    location /api/ {
        limit_req zone=auctix_api burst=60 nodelay;

        proxy_pass         http://auctix_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;   # keeps the port, unlike $host
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---------------------------------------------------------------- WebSocket
    # The STOMP connection is long lived: upgrade it and keep the read timeout high
    # so an idle auction page is not disconnected between bids.
    location /ws {
        proxy_pass         http://auctix_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $http_host;   # keeps the port, unlike $host
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------- health & docs
    location /actuator/health {
        proxy_pass       http://auctix_backend;
        proxy_set_header Host $http_host;
        access_log       off;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass       http://auctix_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------- lot photographs
    # Served from the backend's static resources, NOT the SPA. Without this block these
    # requests fall through to "location /" and the frontend answers with index.html.
    location /images/ {
        proxy_pass       http://auctix_backend;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        expires    7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------------------------------------------------------------- seller uploads
    # Same reasoning as /images/: these are served by the backend from the uploads-data
    # volume, so without this block they would fall through to the SPA.
    location /uploads/ {
        proxy_pass       http://auctix_backend;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        expires    7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------------------------------------------------------------- SPA
    location / {
        proxy_pass         http://auctix_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host       $http_host;
        proxy_set_header   Connection "";
    }
}
